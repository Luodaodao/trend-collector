# 免费热榜配置（不需要任何 Key）
free_hot:
  baidu_count: 100            # 百度热搜条数
  bilibili_count: 100         # B站热门条数
  toutiao_count: 100          # 今日头条热榜条数
  netease_count: 100          # 网易新闻热榜条数（该接口可能已失效）
  qqnews_count: 100           # 腾讯新闻热榜条数（该接口可能已失效）
  sspai_count: 100            # 少数派最新条数（可能需登录）
  juejin_count: 100           # 掘金热门条数
  ithome_count: 100           # IT之家资讯条数
  github_count: 25            # GitHub Trending条数

# NewsBing 多平台热点聚合（免 Key，本系统最重要的源）
# 覆盖：小红书创作热点 / 微博热搜 / 知乎热榜 / B站热门·排行榜·热搜 /
#       抖音热榜 / 百度热搜 / 今日头条 / V2EX / X / Hacker News
newsbing:
  enabled: true
  count_per_source: 100       # 每个榜单取前N条（取回后再按关键词过滤）
  timeout: 120                # 单次请求超时（秒）
  retries: 3                  # 重试次数（响应可能中途断开，多轮累积互补）

# 各平台付费采集开关（需要 tikhub.enabled=true 才生效）
platforms:
  douyin:
    enabled: false            # 抖音热榜（付费）
    hot_list_count: 100
    search_count: 20
  xiaohongshu:
    enabled: false            # 小红书搜索（付费，用于抓低粉爆款）
    search_count: 30
  bilibili:
    enabled: false            # B站TikHub热榜（免费源已覆盖）
    hot_list_count: 100
    search_count: 20
  wechat_mp:
    enabled: false
    search_count: 20
  wechat_channels:
    enabled: false
    search_count: 20
  youtube:
    enabled: false
    search_count: 20

# 爆款筛选阈值（点赞数超过此值才进入拆解池）
viral_threshold:
  min_likes: 5000
  min_comments: 200

# 爆款时间窗口（只取最近N小时内发布的内容）
viral_window_hours: 48

# 日志配置
log:
  level: "INFO"
  file: "trend_collector.log"
