# ====================================
# 平台热点捕捉系统 - 配置文件模板
# 由 setup_feishu.py 自动生成 config.yaml 并填入飞书信息
# ====================================

# TikHub API 配置（付费源，可选）
# 不填也能跑：只采免费源（含 NewsBing，已覆盖 10 个平台）
tikhub:
  api_key: ""
  base_url: "https://api.tikhub.io"
  enabled: false          # 填了 key 之后改成 true 才会走付费采集

# 飞书多维表格配置（由 setup_feishu.py 自动填写）
feishu:
  app_token: "__APP_TOKEN__"
  hot_pool_table_id: "__HOT_POOL_TABLE_ID__"
  viral_pool_table_id: "__VIRAL_POOL_TABLE_ID__"

